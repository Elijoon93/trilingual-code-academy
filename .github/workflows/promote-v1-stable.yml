name: Promote v1 Stable

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-v1-stable.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch application source to v1.0.0 Stable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          required=[
              "const APP_VERSION='1.0.0-rc2-hf2-fa-localization-audit';",
              "const HF2_VERSION='1.0.0-rc2-hf2-fa-localization-audit';",
              'trilingual_code_academy_state_v1'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Stable promotion safety gate failed: '+repr(missing))

          replacements=[
              ("const APP_VERSION='1.0.0-rc2-hf2-fa-localization-audit';","const APP_VERSION='1.0.0';"),
              ("const HF2_VERSION='1.0.0-rc2-hf2-fa-localization-audit';","const HF2_VERSION='1.0.0';"),
              ('<small>English · Deutsch · Coding · One Learning OS</small>','<small>English · Deutsch · Coding · One Learning OS · v1.0 Stable</small>'),
              ("tag.textContent='نسخه آزمایشی نهایی '+HF2_VERSION","tag.textContent='نسخه پایدار '+HF2_VERSION"),
              ('نسخه RC2-HF2 با تقویم جلالی، رابط فارسی سخت‌گیرانه‌تر، مسیرهای English/Deutsch/Coding، یادگیری تطبیقی، تمرین، Code Lab و PWA. Final Stable فقط پس از شواهد واقعی دستگاه و بازبینی انسانی محتوا مجاز است.','نسخه پایدار وب v1.0 با تقویم جلالی، رابط فارسی، مسیرهای English/Deutsch/Coding، یادگیری تطبیقی، تمرین، Code Lab و PWA. کنترل‌های خودکار Release و استقرار GitHub Pages عبور کرده‌اند؛ تأیید فیزیکی Android/PWA به‌عنوان Device Certification جداگانه ثبت می‌شود.'),
              ('هنوز Final Stable اعلام نشده است.','نسخه پایدار وب v1.0 منتشر شده است.'),
              ('TriLingual_Code_Academy_RC2_HF2_Backup_','TriLingual_Code_Academy_v1.0.0_Stable_Backup_'),
              ('پشتیبان بازیابی و مستقیماً به Schema 13 / RC2-HF2 ارتقا داده شد.','پشتیبان بازیابی و مستقیماً به Schema 13 / v1.0 Stable ارتقا داده شد.'),
              ('Final Stable فقط پس از شواهد واقعی Windows و Android/PWA، Closure فنی و Sign-off محتوا فعال می‌شود.','Device Certification فقط پس از شواهد واقعی Windows و Android/PWA، Closure فنی و Sign-off محتوا کامل می‌شود.'),
              ("s.ready?'✓ همه Gateهای RC2 آماده Final هستند':'v1.0 Final Stable هنوز BLOCKED است'","s.ready?'✓ Device Certification کامل است':'Device Certification هنوز تکمیل نشده است'"),
              ('RC2 خودش Final نیست و هیچ Device PASS را جعل نمی‌کند.','این بخش آرشیو Device Certification است و هیچ Device PASS را جعل نمی‌کند.'),
              ('عبور کنترل‌های داخلی به‌تنهایی معادل Final Stable نیست.','عبور کنترل‌های داخلی به‌تنهایی معادل Device Certification فیزیکی نیست.'),
              ('<span class="tag">RC2-HF2</span>','<span class="tag">v1.0 Stable</span>'),
              ('ممیزی عمیق HF2','ممیزی عمیق v1.0')
          ]
          for old,new in replacements:
              s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          Path('source/TriLingual_Code_Academy_v1.0.0_Stable.html').write_bytes(p.read_bytes())
          print('STABLE_INDEX_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Install static audit dependency
        run: pip install beautifulsoup4

      - name: Static acceptance audit
        run: python tests/final_acceptance_static.py

      - name: JavaScript syntax audit
        run: node tests/js_syntax_audit.mjs

      - name: Commit and push stable source
        shell: bash
        run: |
          git config user.name 'Elijoon93'
          git config user.email 'abtin412@gmail.com'
          git add index.html source/TriLingual_Code_Academy_v1.0.0_Stable.html
          git commit -m 'Release v1.0.0 Stable Web source'
          git push origin main
